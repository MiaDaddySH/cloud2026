server:
  port: 80

payment:
  service:
    url: ${PAYMENT_SERVICE_URL:http://cloud-payment-service}



spring:
  application:
    name: cloud-consumer-order
  ####Spring Cloud Consul for Service Discovery
  cloud:
    consul:
      host: localhost
      port: 8500
      discovery:
        prefer-ip-address: true #优先使用服务ip进行注册
        service-name: ${spring.application.name}

